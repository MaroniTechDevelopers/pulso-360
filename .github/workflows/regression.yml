name: Regressão Pulso 360
on:
  push:
    paths: ['index.html', 'tests/**', '.github/workflows/regression.yml']
  pull_request:
    paths: ['index.html', 'tests/**', '.github/workflows/regression.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
